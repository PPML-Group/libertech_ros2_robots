# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    arm_right_effort_controller:
      type: effort_controllers/JointGroupEffortController


    arm_left_effort_controller:
      type: effort_controllers/JointGroupEffortController

    
    movement_effort_controller:
      type: effort_controllers/JointGroupEffortController


    head_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController 


    hand_right_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_left_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_right_effort_controller:
  ros__parameters:
    joints:
      - arm_right_shoulder_pitch_joint
      - arm_right_shoulder_roll_joint
      - arm_right_shoulder_yaw_joint
      - arm_right_elbow_pitch_joint
      - arm_right_elbow_roll_joint
      - arm_right_wrist_pitch_joint
      - arm_right_wrist_yaw_joint
    
arm_left_effort_controller:
  ros__parameters:
    joints:
      - arm_left_shoulder_pitch_joint
      - arm_left_shoulder_roll_joint
      - arm_left_shoulder_yaw_joint
      - arm_left_elbow_pitch_joint
      - arm_left_elbow_roll_joint
      - arm_left_wrist_pitch_joint
      - arm_left_wrist_yaw_joint
   
# 适配Pinocchio顺序
movement_effort_controller:
  ros__parameters:
    joints:
      - waist_yaw_joint
      - leg_left_hip_yaw_joint
      - leg_left_hip_roll_joint
      - leg_left_hip_pitch_joint
      - leg_left_knee_pitch_joint
      - leg_left_ankle_pitch_joint
      - leg_right_hip_yaw_joint
      - leg_right_hip_roll_joint
      - leg_right_hip_pitch_joint
      - leg_right_knee_pitch_joint
      - leg_right_ankle_pitch_joint      

head_trajectory_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

hand_right_trajectory_controller:
  ros__parameters:
    joints:
      - hand_right_f11_joint
      - hand_right_f12_joint
      - hand_right_f13_joint
      - hand_right_f14_joint
      - hand_right_f21_joint
      - hand_right_f22_joint
      - hand_right_f23_joint
      - hand_right_f24_joint
      - hand_right_f31_joint
      - hand_right_f32_joint
      - hand_right_f33_joint
      - hand_right_f34_joint
      - hand_right_f41_joint
      - hand_right_f42_joint
      - hand_right_f43_joint
      - hand_right_f44_joint
      - hand_right_f51_joint
      - hand_right_f52_joint
      - hand_right_f53_joint
      - hand_right_f54_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

    # interpolation_method: splines
    open_loop_control: false
    # state_publish_rate: 500.0
    

hand_left_trajectory_controller:
  ros__parameters:
    joints:
      - hand_left_f11_joint
      - hand_left_f12_joint
      - hand_left_f13_joint
      - hand_left_f14_joint
      - hand_left_f21_joint
      - hand_left_f22_joint
      - hand_left_f23_joint
      - hand_left_f24_joint
      - hand_left_f31_joint
      - hand_left_f32_joint
      - hand_left_f33_joint
      - hand_left_f34_joint
      - hand_left_f41_joint
      - hand_left_f42_joint
      - hand_left_f43_joint
      - hand_left_f44_joint
      - hand_left_f51_joint
      - hand_left_f52_joint
      - hand_left_f53_joint
      - hand_left_f54_joint
    command_interfaces:
      - position
    state_interfaces:
      - position