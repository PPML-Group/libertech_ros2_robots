# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    arm_right_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm_left_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_right_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_left_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm_right_cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController
    

    arm_left_cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_right_trajectory_controller:
  ros__parameters:
    joints:
      - arm_right_shoulder_pitch_joint
      - arm_right_shoulder_roll_joint
      - arm_right_shoulder_yaw_joint
      - arm_right_elbow_pitch_joint
      - arm_right_elbow_roll_joint
      - arm_right_wrist_pitch_joint
      - arm_right_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # action_monitor_rate: 20.0
    # allow_integration_in_goal_trajectories: false
    # allow_nonzero_velocity_at_trajectory_end: false
    # allow_partial_joints_goal: false
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01
    # 力限制改大一点就行
    # gains:
    #   arm_right_shoulder_pitch_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 1.0
    #   arm_right_shoulder_roll_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    #   arm_right_shoulder_yaw_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    #   arm_right_elbow_pitch_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    #   arm_right_elbow_roll_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    #   arm_right_wrist_pitch_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    #   arm_right_wrist_yaw_joint:
    #     angle_wraparound: false
    #     d: 100.0
    #     i: 10.0
    #     i_clamp: 0.0
    #     p: 100.0
    interpolation_method: splines
    open_loop_control: false
    state_publish_rate: 1000.0


