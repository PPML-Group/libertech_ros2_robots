arm_right_cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "hand_right_palm"
    robot_base_link: "baseout"
    joints:
      - arm_right_shoulder_pitch_joint
      - arm_right_shoulder_roll_joint
      - arm_right_shoulder_yaw_joint
      - arm_right_elbow_pitch_joint
      - arm_right_elbow_roll_joint
      - arm_right_wrist_pitch_joint
      - arm_right_wrist_yaw_joint

    # Choose: position or velocity.
    command_interfaces:
      - position
        #- velocity
    state_interfaces:
      - position

    solver:
        error_scale: 1.0
        iterations: 10

    pd_gains:
        trans_x: {p: 1.0}
        trans_y: {p: 1.0}
        trans_z: {p: 1.0}
        rot_x: {p: 0.5}
        rot_y: {p: 0.5}
        rot_z: {p: 0.5}

        # trans_x: {p: 5.0}
        # trans_y: {p: 5.0}
        # trans_z: {p: 5.0}
        # rot_x: {p: 2.0}
        # rot_y: {p: 2.0}
        # rot_z: {p: 2.0}


